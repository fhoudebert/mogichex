// mogichex.gradle — signature et numéros de version de l'APK.
//
// Appliqué par app/build.gradle, en dernière ligne :
//     apply from: 'mogichex.gradle'
//
// Ce fichier est VERSIONNÉ et ne contient aucun secret. Il remplace
// keystore.properties : les quatre réglages de signature sont lus, dans cet
// ordre, dans
//   1. les propriétés Gradle : -PNOM=… en ligne de commande, ou
//      ~/.gradle/gradle.properties (le fichier de l'UTILISATEUR, hors dépôt) ;
//   2. les variables d'environnement du même nom (c'est ce que fait le CI).
//
//   MOGICHEX_KEYSTORE_FILE      chemin du keystore (absolu, ou relatif à android/)
//   MOGICHEX_KEYSTORE_PASSWORD  mot de passe du magasin
//   MOGICHEX_KEY_ALIAS          alias de la clé (défaut : mogichex)
//   MOGICHEX_KEY_PASSWORD       mot de passe de la clé (défaut : celui du magasin,
//                               ce qui est la règle pour un keystore PKCS12)
//
// Sans MOGICHEX_KEYSTORE_FILE, rien n'est signé en release : Gradle produit
// app-release-unsigned.apk. Le debug, lui, ne dépend jamais de ces réglages.
//
// Version : versionName vient de package.json (source unique), versionCode en
// est déduit (MAJEUR*10000 + MINEUR*100 + CORRECTIF) sauf si MOGICHEX_VERSION_CODE
// le fixe. Il doit croître d'une publication à l'autre : Android refuse une mise
// à jour dont le versionCode est inférieur à celui qui est installé.

def mogichexSetting = { String name ->
    def v = project.findProperty(name)
    if (v == null || v.toString().isEmpty()) v = System.getenv(name)
    return (v == null || v.toString().isEmpty()) ? null : v.toString()
}

// android/gradle.properties est versionné : un mot de passe qui s'y trouverait
// partirait au prochain commit. On s'arrête plutôt que de le lire.
def projectProps = rootProject.file('gradle.properties')
if (projectProps.exists() && projectProps.text =~ /(?m)^\s*MOGICHEX_(KEYSTORE|KEY)_PASSWORD\s*[=:]/) {
    throw new GradleException(
        "android/gradle.properties contient un mot de passe de signature, or ce fichier est versionné.\n" +
        "Le déplacer dans ~/.gradle/gradle.properties (ou une variable d'environnement).")
}

// --- version -----------------------------------------------------------------
def packageJson = rootProject.file('../package.json')
def mogichexVersionName = new groovy.json.JsonSlurper().parse(packageJson).version.toString()
def mogichexVersionCode
if (mogichexSetting('MOGICHEX_VERSION_CODE')) {
    mogichexVersionCode = mogichexSetting('MOGICHEX_VERSION_CODE').toInteger()
} else {
    def parts = mogichexVersionName.tokenize('.').collect { it.toInteger() }
    if (parts.size() < 1 || parts.size() > 3 || parts.drop(1).any { it > 99 }) {
        throw new GradleException(
            "version « ${mogichexVersionName} » de package.json : impossible d'en déduire un versionCode " +
            "(attendu MAJEUR[.MINEUR[.CORRECTIF]], MINEUR et CORRECTIF < 100). Fixer MOGICHEX_VERSION_CODE.")
    }
    while (parts.size() < 3) parts << 0
    mogichexVersionCode = parts[0] * 10000 + parts[1] * 100 + parts[2]
}

android {
    defaultConfig {
        versionCode mogichexVersionCode
        versionName mogichexVersionName
    }
}

// --- signature ---------------------------------------------------------------
def storePath = mogichexSetting('MOGICHEX_KEYSTORE_FILE')
if (storePath) {
    def ksFile = rootProject.file(storePath)   // un chemin absolu reste absolu
    def ksPassword = mogichexSetting('MOGICHEX_KEYSTORE_PASSWORD')
    def ksAlias = mogichexSetting('MOGICHEX_KEY_ALIAS') ?: 'mogichex'
    def ksKeyPassword = mogichexSetting('MOGICHEX_KEY_PASSWORD') ?: ksPassword
    if (!ksFile.isFile()) {
        throw new GradleException("MOGICHEX_KEYSTORE_FILE désigne ${ksFile}, qui n'existe pas.")
    }
    if (!ksPassword) {
        throw new GradleException("MOGICHEX_KEYSTORE_FILE est défini mais pas MOGICHEX_KEYSTORE_PASSWORD.")
    }
    android {
        signingConfigs {
            mogichexRelease {
                storeFile ksFile
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.mogichexRelease
            }
        }
    }
    logger.lifecycle("mogichex : release signée avec ${ksFile.name} (alias ${ksAlias}), version ${mogichexVersionName} (${mogichexVersionCode})")
} else {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
            logger.warn("mogichex : MOGICHEX_KEYSTORE_FILE non défini — APK release NON SIGNÉ " +
                        "(app-release-unsigned.apk), inutilisable tel quel. Voir android/README.md.")
        }
    }
}
